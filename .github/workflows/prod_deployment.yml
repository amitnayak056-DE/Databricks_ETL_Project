name: 'production_deployment'

concurrency: 1

on: 
  push: 
    branches:
      - main
    paths:
      - 'databricks_etl/**'

jobs:
  deploy: 
    name: 'Deploy Bundle'
    runs-on: ubuntu-latest
    steps:
      - uses: databricks/setup-cli@main
      - run: databricks bundle deploy
      working-directory: databricks_etl
      env: 
        DATABRICKS_TOKEN: ${{ secrets.SP_TOKEN }}
        DATABRICKS_BUNDLE_ENV: prod
